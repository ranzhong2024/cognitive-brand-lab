<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 64" width="480" height="64" fill="none" role="img" aria-label="BRANDOS LAB Horizontal Lockup">
  <defs>
    <linearGradient id="hCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="hWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="480" height="64" rx="8" fill="#09090B"/>

  <!-- Left: Monogram Mark (48x48 scale embedded at x=8, y=8) -->
  <g transform="translate(8, 4) scale(0.875)">
    <!-- Monogram Background -->
    <rect width="64" height="64" rx="12" fill="#09090B" stroke="#27272A" stroke-width="1.2"/>
    
    <!-- Calibration Ticks -->
    <g opacity="0.4" stroke="#00F2FE" stroke-width="0.75">
      <line x1="32" y1="4" x2="32" y2="8" stroke-linecap="round"/>
      <line x1="32" y1="56" x2="32" y2="60" stroke-linecap="round"/>
      <line x1="4" y1="32" x2="8" y2="32" stroke-linecap="round"/>
      <line x1="56" y1="32" x2="60" y2="32" stroke-linecap="round"/>
    </g>

    <!-- Spine -->
    <rect x="12" y="12" width="6.5" height="40" rx="1.5" fill="url(#hWhiteGrad)"/>
    <line x1="15.25" y1="16" x2="15.25" y2="48" stroke="#00F2FE" stroke-width="1.25" stroke-linecap="round"/>

    <!-- Upper Loop -->
    <path d="M 22 12 H 37 C 42.5 12 46.5 16 46.5 21.25 C 46.5 26.5 42.5 30.5 37 30.5 H 22 V 12 Z 
             M 28 17.5 V 25 H 36 C 38.5 25 40.5 23.5 40.5 21.25 C 40.5 19 38.5 17.5 36 17.5 H 28 Z" 
          fill="url(#hWhiteGrad)"/>

    <!-- Lower Loop -->
    <path d="M 22 33.5 H 39 C 45.5 33.5 50.5 38 50.5 42.75 C 50.5 47.5 45.5 52 39 52 H 22 V 33.5 Z 
             M 28 39 V 46.5 H 38.5 C 41.5 46.5 44 45 44 42.75 C 44 40.5 41.5 39 38.5 39 H 28 Z" 
          fill="url(#hWhiteGrad)"/>

    <!-- Reticle Focal Point -->
    <g filter="url(#hGlow)">
      <circle cx="32" cy="32" r="2" fill="#00F2FE"/>
      <circle cx="32" cy="32" r="4.5" stroke="#00F2FE" stroke-width="0.75" stroke-dasharray="1.5 1.5" fill="none"/>
      <line x1="19" y1="32" x2="21" y2="32" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Middle Divider Line (Precision 1px Hairline) -->
  <line x1="78" y1="14" x2="78" y2="50" stroke="#27272A" stroke-width="1"/>

  <!-- Right: Precision Typography Hierarchy -->
  <g transform="translate(94, 0)">
    <!-- Primary English Brand Name -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="16" font-weight="900" letter-spacing="0.16em" fill="#FAFAFA">
      BRANDOS LAB<tspan font-size="9" font-weight="700" fill="#00F2FE" dx="3" dy="-6">TM</tspan>
    </text>

    <!-- Secondary Chinese Lab Identity -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700" letter-spacing="0.12em" fill="#E4E4E7">
      品牌科学实验室
    </text>

    <!-- Micro System Engineering Tagline -->
    <text x="0" y="56" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8" font-weight="600" letter-spacing="0.18em" fill="#00F2FE" opacity="0.85">
      [THE COGNITIVE BRAND OS · BY RAN]
    </text>
  </g>

  <!-- Rightmost Terminal Telemetry Status -->
  <g transform="translate(385, 20)" opacity="0.8">
    <rect width="80" height="24" rx="4" fill="#111622" stroke="#27272A" stroke-width="0.75"/>
    <text x="40" y="15" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#00F2FE" text-anchor="middle" letter-spacing="0.1em">
      SYS::ACTIVE
    </text>
  </g>
</svg>
