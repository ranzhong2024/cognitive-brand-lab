    <text x="20" y="200" fill="#94A3B8" font-family="sans-serif" font-size="13">• 顶级用料与豪华权益</text>
    <text x="20" y="235" fill="#64748B" font-family="sans-serif" font-size="12">作用：拉高全店溢价感知</text>
  </g>

  <!-- Bottom Result Banner -->
  <g transform="translate(30, 435)">
    <rect width="700" height="60" rx="12" fill="#0D1F1A" stroke="#10B981" stroke-width="1.5"/>
    <text x="25" y="35" fill="#34D399" font-family="sans-serif" font-size="15" font-weight="900">🏆 财务成果：比竞品贵 30% 仍被疯抢 • AOV 跃升 +48% • 实收口袋毛利率牢牢守死 ≥65%</text>
