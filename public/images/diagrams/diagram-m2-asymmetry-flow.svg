<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#09090B; border-radius:16px; border:1px solid #232B3E;">
  <rect width="100%" height="100%" fill="#09090B"/>
  
  <!-- Watermark Elements -->
  <text x="400" y="225" fill="rgba(255, 255, 255, 0.03)" font-family="sans-serif" font-size="32" font-weight="900" text-anchor="middle" transform="rotate(-12 400 225)" letter-spacing="4">BRANDOS LAB™ // 品牌科学实验室™</text>
  <text x="780" y="438" fill="rgba(0, 242, 254, 0.35)" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">BRANDOS LAB™ 品牌科学实验室 • 实证研究版权所有</text>

  <text x="400" y="40" fill="#FAFAFA" font-family="sans-serif" font-size="17" font-weight="900" text-anchor="middle">跨境电商极端信息不对称与四大硬核质押破局图</text>

  <!-- Ocean Gap in Middle -->
  <g transform="translate(360, 90)">
    <rect width="80" height="300" rx="8" fill="#02131E" stroke="#0284C7" stroke-dasharray="4 4"/>
    <text x="40" y="130" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(90 40 130)">隔着太平洋的信息不对称</text>
    <text x="40" y="260" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" transform="rotate(90 40 260)">买家高度防备</text>
  </g>

  <!-- Left: Chinese Manufacturer / Seller -->
  <g transform="translate(60, 90)">
    <rect width="280" height="300" rx="12" fill="#111622" stroke="#232B3E"/>
    <text x="140" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">中国优质出海工厂/卖家</text>

    <rect x="20" y="55" width="240" height="45" rx="6" fill="#09090B" stroke="#334155"/>
    <text x="30" y="82" fill="#94A3B8" font-family="sans-serif" font-size="11">实际做工与供应链用料极硬</text>

    <text x="140" y="135" fill="#EF4444" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">❌ 传统死穴：发廉价言论</text>
    <text x="140" y="155" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">写“Quality First / 100% Best”</text>

    <text x="140" y="195" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚡ BrandOS 解法：四大硬核质押</text>
    <text x="30" y="225" fill="#A7F3D0" font-family="sans-serif" font-size="11">① 物理透明：微距拆解爆炸图</text>
    <text x="30" y="245" fill="#A7F3D0" font-family="sans-serif" font-size="11">② 权威认证：UL/TÜV 质检报告</text>
    <text x="30" y="265" fill="#A7F3D0" font-family="sans-serif" font-size="11">③ 售后兜底：10年包换/99天试用</text>
    <text x="30" y="285" fill="#A7F3D0" font-family="sans-serif" font-size="11">④ 暴力破坏实测：汽车碾压完好</text>
  </g>

  <!-- Right: US/EU Buyers -->
  <g transform="translate(460, 90)">
    <rect width="280" height="300" rx="12" fill="#111622" stroke="#232B3E"/>
    <text x="140" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">海外高净值消费者心智</text>

    <rect x="20" y="55" width="240" height="70" rx="6" fill="#1C1917" stroke="#44403C"/>
    <text x="30" y="78" fill="#FCA5A5" font-family="sans-serif" font-size="11" font-weight="bold">本能防御机制 (PKM 启动)</text>
    <text x="30" y="98" fill="#A8A29E" font-family="sans-serif" font-size="10">“口头吹嘘等于骗子，我不信”</text>
    <text x="30" y="112" fill="#78716C" font-family="sans-serif" font-size="10">“只敢买最便宜的当一次性用品”</text>

    <rect x="20" y="145" width="240" height="135" rx="6" fill="#064E3B" stroke="#047857"/>
    <text x="30" y="172" fill="#6EE7B7" font-family="sans-serif" font-size="12" font-weight="bold">收到四大硬核质押信号后：</text>
    <text x="30" y="197" fill="#E2E8F0" font-family="sans-serif" font-size="11">• “敢做 10 年质保，绝对靠谱”</text>
    <text x="30" y="220" fill="#E2E8F0" font-family="sans-serif" font-size="11">• “看得到真实测试，值得多花钱”</text>
    <text x="30" y="245" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="bold">• 结果：心甘情愿支付 3-5 倍溢价</text>
  </g>
</svg>