  <circle cx="400" cy="105" r="6" fill="#00F2FE"/>
  <text x="400" y="88" fill="#FAFAFA" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">WHY: 刚需断层 (暴风雪极寒备电)</text>
  
  <circle cx="515" cy="170" r="6" fill="#00F2FE"/>
  <text x="530" y="175" fill="#FAFAFA" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="start">WHEN: 突发断电/深夜紧急</text>

  <circle cx="505" cy="295" r="6" fill="#00F2FE"/>
