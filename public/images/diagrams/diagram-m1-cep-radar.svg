  <text x="780" y="438" fill="rgba(0, 242, 254, 0.35)" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10" font-weight="bold" text-anchor="end">BRANDOS LAB™ 品牌科学实验室 • 实证研究版权所有</text>

  
  <text x="400" y="38" fill="#FAFAFA" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="900" text-anchor="middle">5W1H 品类进入点 (CEPs) 场景雷达与需求垄断模型</text>
