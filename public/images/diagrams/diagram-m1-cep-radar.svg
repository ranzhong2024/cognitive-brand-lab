  <polygon points="400,105 515,170 505,295 400,360 285,290 295,165" fill="rgba(0, 242, 254, 0.15)" stroke="#00F2FE" stroke-width="2.5"/>
  <!-- White-label Polygon -->
  <polygon points="400,205 435,220 420,250 400,255 375,240 385,215" fill="rgba(244, 63, 94, 0.15)" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 3"/>

