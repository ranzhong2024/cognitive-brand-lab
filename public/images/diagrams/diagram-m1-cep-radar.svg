  <circle cx="400" cy="235" r="130" fill="none" stroke="#232B3E" stroke-width="1.5"/>
  <line x1="400" y1="85" x2="400" y2="385" stroke="#232B3E" stroke-width="1"/>
  <line x1="270" y1="160" x2="530" y2="310" stroke="#232B3E" stroke-width="1"/>
  <line x1="270" y1="310" x2="530" y2="160" stroke="#232B3E" stroke-width="1"/>

