  <text x="44" y="182" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="900">从 0 到 1</text>
  <text x="44" y="234" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="900">品牌框架五层架构</text>

  <rect x="46" y="256" width="132" height="3.5" rx="2" fill="url(#beamGrad)"/>

