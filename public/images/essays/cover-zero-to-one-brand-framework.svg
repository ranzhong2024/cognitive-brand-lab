    <polygon points="20,200 310,200 324,240 6,240" fill="rgba(129, 140, 248, 0.15)" stroke="#818CF8" stroke-width="1.8"/>
    <text x="165" y="225" fill="#C7D2FE" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">L2 · 身份棱镜与独特资产 DBAs</text>

