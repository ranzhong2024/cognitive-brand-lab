  <text x="46" y="470" fill="#64748B" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11">CASES: LIQUID DEATH · PATAGONIA · WARBY PARKER</text>
  <text x="754" y="470" fill="rgba(0, 242, 254, 0.5)" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11" font-weight="bold" text-anchor="end">BRANDOS LAB™ // 品牌科学实验室</text>
