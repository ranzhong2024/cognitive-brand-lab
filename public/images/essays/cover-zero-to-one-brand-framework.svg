    <text x="165" y="169" fill="#E9D5FF" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">L3 · CBBE 心智阶梯与共鸣</text>

