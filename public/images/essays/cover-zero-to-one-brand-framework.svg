  <rect width="800" height="500" fill="url(#cyanAura)"/>

  <!-- Subtle Outer Calibration Border -->
  <rect x="16" y="16" width="768" height="468" rx="14" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Top Telemetry Header -->
  <rect x="44" y="38" width="218" height="26" rx="13" fill="rgba(0, 242, 254, 0.09)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1"/>
  <circle cx="60" cy="51" r="3.5" fill="#00F2FE"/>
  <text x="72" y="55" fill="#00F2FE" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11" font-weight="bold" letter-spacing="1.5">M1 // BRAND ARCHITECTURE</text>

  <text x="752" y="55" fill="#64748B" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11" font-weight="bold" text-anchor="end" letter-spacing="1.2">FIELD OBSERVATION · 01</text>
  <line x1="44" y1="80" x2="756" y2="80" stroke="#1E293B" stroke-width="1"/>

