    <text x="34" y="22" fill="#E2E8F0" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold">Keller CBBE 心智金字塔</text>
    <text x="318" y="22" fill="#38BDF8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11" text-anchor="end">记忆网络</text>

    <rect x="0" y="46" width="335" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="18" cy="64" r="4.5" fill="#818CF8"/>
    <text x="34" y="68" fill="#E2E8F0" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold">Byron Sharp 双重可得性</text>
    <text x="318" y="68" fill="#A5B4FC" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11" text-anchor="end">破圈公式</text>

    <rect x="0" y="92" width="335" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="18" cy="110" r="4.5" fill="#10B981"/>
    <text x="34" y="114" fill="#E2E8F0" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold">Spence 诺奖昂贵信号</text>
    <text x="318" y="114" fill="#6EE7B7" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11" text-anchor="end">高溢价质押</text>
