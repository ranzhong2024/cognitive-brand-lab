  <text x="48" y="112" fill="#94A3B8" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">Klaviyo 基准：仅占 5.3% 发信量的自动化流贡献 41% 营收；弃购平均 RPR $3.65–$6.77 vs 群发 $0.11</text>

