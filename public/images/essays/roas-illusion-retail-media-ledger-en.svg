<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="gridMap4En" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#09090B"/>
  <rect width="800" height="500" fill="url(#gridMap4En)"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <!-- Header -->
  <text x="48" y="58" fill="#FB923C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">INCREMENTALITY &amp; RETAIL MEDIA LEDGER // 2026 FILINGS</text>
  <text x="752" y="58" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5">FIGURE 01 · EN</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18.5" font-weight="800">Ad-Platform ROAS Mirage vs. 2026 US Retail Media Profit Ledgers</text>
  <text x="48" y="109" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Real-world ad cuts reveal non-incremental spend while store giants harvest 70%–80%+ margins from onsite ads</text>

  <!-- Top Left: Ad-Cut Reality -->
  <rect x="48" y="126" width="342" height="140" rx="10" fill="#111622" stroke="#F43F5E" stroke-opacity="0.45"/>
  <text x="64" y="150" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">A // AD-CUT TESTS: WHAT ACTUALLY HAPPENED?</text>

  <text x="64" y="174" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="10.5">eBay paused brand search → organic fallback</text>
  <rect x="64" y="180" width="248" height="10" rx="4" fill="#1E293B"/>
  <rect x="64" y="180" width="247" height="10" rx="4" fill="#F43F5E"/>
  <text x="320" y="189" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">99.5%</text>

  <text x="64" y="209" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="10.5">Airbnb cut $600M+ → traffic rebound</text>
  <rect x="64" y="215" width="248" height="10" rx="4" fill="#1E293B"/>
  <rect x="64" y="215" width="236" height="10" rx="4" fill="#FB923C"/>
  <text x="320" y="224" fill="#FDBA74" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">95.0%</text>

  <text x="64" y="247" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10.5">Uber cut $100M (~2/3 mobile ads) → installs</text>
  <text x="374" y="247" text-anchor="end" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">Held flat</text>

  <!-- Top Right: Budget Wall Math -->
  <rect x="410" y="126" width="342" height="140" rx="10" fill="#111622" stroke="#38BDF8" stroke-opacity="0.45"/>
  <text x="426" y="150" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">B // SCALING WALL (50% GROSS MARGIN EXAMPLE)</text>

  <rect x="426" y="164" width="148" height="62" rx="7" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="438" y="182" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Spend $50K/mo (Profit)</text>
  <text x="438" y="202" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="15" font-weight="800">+$25K Net</text>
  <text x="438" y="218" fill="#64748B" font-family="'Inter', sans-serif" font-size="9.5">$150K new sales · $75K GP</text>

  <rect x="588" y="164" width="148" height="62" rx="7" fill="#0F172A" stroke="#F43F5E" stroke-opacity="0.5"/>
  <text x="600" y="182" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Double to $100K (Loss)</text>
  <text x="600" y="202" fill="#FDA4AF" font-family="'Inter', sans-serif" font-size="15" font-weight="800">-$10K Loss</text>
  <text x="600" y="218" fill="#64748B" font-family="'Inter', sans-serif" font-size="9.5">Next $50K adds just $30K lift</text>

  <text x="426" y="249" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10.5">Ad tool claims $220K organic → reports <tspan fill="#FCD34D" font-weight="800">4.0x Avg ROAS</tspan></text>

  <!-- Bottom Row: 3 Retail Giants -->
  <text x="48" y="292" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">C // 2026 US RETAIL MEDIA LEDGERS (~$71B MARKET · 3–4% RETAIL OP MARGIN VS 70–80%+ AD MARGIN)</text>

  <!-- Amazon -->
  <rect x="48" y="304" width="224" height="110" rx="10" fill="#111622" stroke="#F59E0B" stroke-opacity="0.45"/>
  <text x="64" y="328" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">AMAZON · DOMINANCE</text>
  <text x="64" y="356" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="22" font-weight="800">$56.7B</text>
  <text x="150" y="355" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">9M 2026 Ads</text>
  <text x="64" y="378" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="10.5">~79.7% US retail media share</text>
  <text x="64" y="398" fill="#FDA4AF" font-family="'Inter', sans-serif" font-size="10.5">CPCs +10–15% · 30–38% ACoS</text>

  <!-- Walmart -->
  <rect x="288" y="304" width="224" height="110" rx="10" fill="#111622" stroke="#38BDF8" stroke-opacity="0.45"/>
  <text x="304" y="328" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">WALMART · PROFIT LIFT</text>
  <text x="304" y="356" fill="#7DD3FC" font-family="'Inter', sans-serif" font-size="22" font-weight="800">+36%</text>
  <text x="378" y="355" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Connect (Q3 FY27)</text>
  <text x="304" y="378" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="10.5">Total US ads +37% (incl. VIZIO)</text>
  <text x="304" y="398" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="10.5">US op income +9.0% vs +5.2% rev</text>

  <!-- Best Buy -->
  <rect x="528" y="304" width="224" height="110" rx="10" fill="#111622" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="544" y="328" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">BEST BUY · MARGIN BUFFER</text>
  <text x="544" y="356" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="22" font-weight="800">24.1%</text>
  <text x="622" y="355" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">US GM (+80bps)</text>
  <text x="544" y="378" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="10.5">Comps +6.1% (5-year high)</text>
  <text x="544" y="398" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="10.5">Ads &amp; $350M GMV offset goods GM</text>

  <!-- Footer -->
  <rect x="48" y="428" width="704" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
  <text x="400" y="447" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700">Operator Rule: Separate brand defense from cold-buyer spend—verify lift with net profit &amp; 14-day pause tests</text>
</svg>
