  <!-- Bottom Output Bar -->
  <rect x="48" y="426" width="704" height="32" rx="6" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="1"/>
  <text x="68" y="446" fill="#ECFDF5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="700">系统输出：高客单价溢价权 (Pricing Power) × 低退货率正向像素回传 (M4) × 跨周期留存复利 (LTV)</text>
  <text x="736" y="446" text-anchor="end" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700">RANBRANDOS.COM</text>
