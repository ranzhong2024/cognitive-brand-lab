    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="500" fill="url(#engBgZh)"/>
  <rect width="800" height="500" fill="url(#engGridZh)"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <text x="48" y="62" fill="#6366F1" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM ARCHITECTURE · BRANDOS™ BEHAVIORAL ENGINE (M1–M6)</text>
  <text x="48" y="90" fill="#F8FAFC" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="800">行为经济学 × BrandOS™ M1–M6 选择架构转化引擎</text>
  <text x="752" y="62" text-anchor="end" fill="#64748B" font-family="monospace" font-size="11">FIG 01 / CHOICE ARCHITECTURE</text>

  <!-- Top Flow Banner: System 1 -> Cugelman Emotion Map Transition -->
  <rect x="48" y="108" width="704" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="130" fill="#38BDF8" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="700">用户心智输入：System 1 直觉快思考（认知吝啬鬼 / 5 秒 AIM 闪测）</text>
  <text x="68" y="148" fill="#94A3B8" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11">情绪跃迁路径：适度唤醒 (Optimistic Hook) ➔ 剥离焦虑与说服防御 (PKM) ➔ 落入笃定安全象限 (Cugelman Secure Zone)</text>
  <rect x="612" y="120" width="124" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="674" y="138" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700">λ = 2.25x 减阻杠杆</text>

  <!-- 2x2 Architectural Core Grid -->
  <!-- Card 1: M3 Reference Point -->
  <g transform="translate(48, 176)">
    <rect width="342" height="112" rx="10" fill="#0F172A" stroke="#6366F1" stroke-width="1.3"/>
    <rect x="16" y="14" width="96" height="22" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="0.8"/>
    <text x="64" y="29" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="10.5" font-weight="700">M3 战略价值定价</text>
    <text x="124" y="29" fill="#F8FAFC" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="700">1. 参照点重构与支付痛感解耦</text>
    <text x="16" y="54" fill="#CBD5E1" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11.5">• 原语：前景理论 (Prospect Theory) + 连贯任意性</text>
    <text x="16" y="74" fill="#CBD5E1" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11.5">• 机制：跨品类重设锚点，用全包/日均化消除岛叶皮层痛感</text>
    <text x="16" y="95" fill="#38BDF8" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">★ 实证：Anker eufy 本地存储“0 月租费”击穿 Ring 人质硬件</text>
  </g>

