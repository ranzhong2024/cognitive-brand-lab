    <text x="124" y="29" fill="#F8FAFC" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="700">2. 神经内疚消除与仰巴脚效应</text>
    <text x="16" y="54" fill="#CBD5E1" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11.5">• 原语：ACC 前扣带皮层内疚抑制 + Pratfall 瑕疵效应</text>
    <text x="16" y="74" fill="#CBD5E1" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11.5">• 机制：主动坦白非核心边界，瞬间缴械买家 PKM 防御雷达</text>
    <text x="16" y="95" fill="#38BDF8" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">★ 实证：Frito-Lay 哑光袋脑电实验 · 诚实边界声明拉升信任</text>
  </g>

  <!-- Card 3: M6 Endowment & IKEA Effect -->
  <g transform="translate(48, 302)">
    <rect width="342" height="112" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.3"/>
    <rect x="16" y="14" width="96" height="22" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="64" y="29" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="10.5" font-weight="700">M6 留存复利飞轮</text>
    <text x="124" y="29" fill="#F8FAFC" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="700">3. 禀赋效应与宜家共创飞轮</text>
    <text x="16" y="54" fill="#CBD5E1" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11.5">• 原语：禀赋效应 (Endowment) + 宜家效应 (IKEA Effect)</text>
    <text x="16" y="74" fill="#CBD5E1" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11.5">• 机制：低门槛实体互动触发心理所有权，退货即触发 2x 痛感</text>
    <text x="16" y="95" fill="#FBBF24" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">★ 实证：Oura Ring 4 寄送 24h 测码盒，2025 营收破 10 亿美元</text>
  </g>

  <!-- Card 4: M5 Barrier Reduction & Heuristics -->
  <g transform="translate(410, 302)">
    <rect width="342" height="112" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.3"/>
    <rect x="16" y="14" width="96" height="22" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="0.8"/>
    <text x="64" y="29" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10.5" font-weight="700">M5 高转化工程</text>
    <text x="124" y="29" fill="#F8FAFC" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="700">4. 认知减阻与启发式信任锚点</text>
    <text x="16" y="54" fill="#CBD5E1" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11.5">• 原语：选择过载消除 + 眼动视觉减阻 (ASCO 1.7s 教训)</text>
    <text x="16" y="74" fill="#CBD5E1" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11.5">• 机制：全包总价前置 + CTA 100px 安全区微助推</text>
    <text x="16" y="95" fill="#34D399" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">★ 实证：Airbnb 全包价 + 房客甄选徽章，转化率从 9% 跃升至 23%</text>
