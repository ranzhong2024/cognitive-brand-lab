<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowCyan" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#09090B"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glowCyan)"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <text x="48" y="60" fill="#FB923C" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700">MARKETING &amp; GROWTH // 营销增长系列 · PART 01</text>
  <text x="752" y="60" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">2026.11.24</text>

  <text x="48" y="98" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="800">看懂品牌增长背后的 5 个底层齿轮</text>
  <text x="48" y="122" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">为什么广告越投越猛，年底账上却没剩钱？2026 美国一线真实案例全景拆解</text>

  <!-- Top Row: 3 Gear Cards -->
  <rect x="48" y="148" width="224" height="118" rx="10" fill="#111622" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="64" y="174" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">GEAR 01 // 需求与渠道</text>
  <text x="64" y="200" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">Nike vs On Running</text>
  <text x="64" y="222" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">直营不是信仰，方便买且守住</text>
  <text x="64" y="240" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">正价体系才是真本事</text>

  <rect x="288" y="148" width="224" height="118" rx="10" fill="#111622" stroke="#00F2FE" stroke-opacity="0.45"/>
  <text x="304" y="174" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">GEAR 02 // 客户与定价</text>
  <text x="304" y="200" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">Costco 64% 净利密码</text>
  <text x="304" y="222" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">把定价当筛选器，围绕愿意长期</text>
  <text x="304" y="240" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">复购的衣食父母算大账</text>

  <rect x="528" y="148" width="224" height="118" rx="10" fill="#111622" stroke="#10B981" stroke-opacity="0.45"/>
  <text x="544" y="174" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">GEAR 03 // 体验与交付</text>
  <text x="544" y="200" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">Starbucks 1,700+ 店改造</text>
  <text x="544" y="222" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">广告救不了烂体验，交付卡点</text>
  <text x="544" y="240" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">不修，买量越猛差评越快</text>

  <!-- Bottom Row: 2 Wide Gear Cards -->
  <rect x="48" y="282" width="344" height="106" rx="10" fill="#111622" stroke="#F59E0B" stroke-opacity="0.45"/>
  <text x="64" y="308" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">GEAR 04 // 利润与现金</text>
  <text x="64" y="334" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700">Amazon $28.1B 利润 vs -$42.4B 现金流</text>
  <text x="64" y="358" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">账面盈利不等于手头有钱，备货周期与真实回款决定生死</text>

  <rect x="408" y="282" width="344" height="106" rx="10" fill="#111622" stroke="#A78BFA" stroke-opacity="0.45"/>
  <text x="424" y="308" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">GEAR 05 // 团队与考核</text>
  <text x="424" y="334" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700">SharkNinja 14 季双位数增长 · 零售新生态</text>
  <text x="424" y="358" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">只盯当月 ROAS 会透支品牌，专业分工与权责对齐才能赢</text>

  <!-- Bottom Strip -->
  <rect x="48" y="404" width="704" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="400" y="427" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">好品牌从来不是单一环节的灵光一闪，而是 5 个齿轮严丝合缝地咬在一起转</text>

  <text x="48" y="460" fill="#52525B" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">RANBRANDOS.COM // 品牌商业观察系列 · 第 1 篇</text>
  <text x="752" y="460" text-anchor="end" fill="#52525B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">SERIES 01/06 // ZH</text>
</svg>