<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" role="img" aria-label="Kapferer 品牌身份六角棱镜模型">
  <rect width="800" height="480" rx="16" fill="#09090B" stroke="#232B3E"/>
  <text x="400" y="240" fill="rgba(255, 255, 255, 0.03)" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="900" text-anchor="middle" transform="rotate(-8 400 240)" letter-spacing="4">BRANDOS LAB™ // 品牌科学实验室</text>

  <text x="400" y="38" fill="#FAFAFA" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="17.5" font-weight="900" text-anchor="middle">Kapferer 品牌身份六角棱镜：把品牌锻造成有血有肉的“活人”</text>
  <text x="400" y="58" fill="#94A3B8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11" text-anchor="middle">外化呈现 (左) vs 内化精神 (右) · 苹果 APPLE 六维身份映射实测</text>

  <!-- Top / Bottom Poles -->
  <rect x="275" y="76" width="250" height="32" rx="16" fill="rgba(0, 242, 254, 0.14)" stroke="#00F2FE"/>
  <text x="400" y="96" fill="#00F2FE" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11.5" font-weight="bold" text-anchor="middle">发送者画像 (BRAND ORIGIN)</text>

  <rect x="265" y="408" width="270" height="32" rx="16" fill="rgba(16, 185, 129, 0.14)" stroke="#10B981"/>
  <text x="400" y="428" fill="#34D399" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11.5" font-weight="bold" text-anchor="middle">接收者镜像 (BUYER MIRROR)</text>

  <!-- Center Hexagon Visual -->
  <polygon points="400,126 510,192 510,322 400,388 290,322 290,192" fill="#111622" stroke="#818CF8" stroke-width="2"/>
  <line x1="290" y1="257" x2="510" y2="257" stroke="#232B3E" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="400" y="218" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="900" text-anchor="middle">外化显性符号</text>
  <text x="400" y="236" fill="#38BDF8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10.5" text-anchor="middle">Visible Signals</text>
  <text x="400" y="294" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="900" text-anchor="middle">内化价值观魂</text>
  <text x="400" y="312" fill="#A5B4FC" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10.5" text-anchor="middle">Soul &amp; Values</text>

  <!-- Left 3 Externalization Cards -->
  <g transform="translate(34, 126)">
    <rect width="232" height="76" rx="10" fill="#111622" stroke="#00F2FE" stroke-opacity="0.6"/>
    <text x="16" y="25" fill="#00F2FE" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11.5" font-weight="bold">1. 体格与外形 (PHYSIQUE)</text>
    <text x="16" y="45" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">产品的工业轮廓与第一触感</text>
    <text x="16" y="64" fill="#94A3B8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10">Apple：一体成型铝机身与极简白盒</text>
  </g>
  <g transform="translate(34, 219)">
    <rect width="232" height="76" rx="10" fill="#111622" stroke="#818CF8" stroke-opacity="0.6"/>
    <text x="16" y="25" fill="#818CF8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11.5" font-weight="bold">2. 交互关系 (RELATIONSHIP)</text>
    <text x="16" y="45" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">品牌与用户共处的协作角色</text>
    <text x="16" y="64" fill="#94A3B8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10">Apple：陪伴独立创作者的灵感搭档</text>
  </g>
  <g transform="translate(34, 312)">
    <rect width="232" height="76" rx="10" fill="#111622" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="16" y="25" fill="#34D399" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11.5" font-weight="bold">3. 客户镜像 (REFLECTION)</text>
    <text x="16" y="45" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">旁观者给品牌用户贴的社会标签</text>
    <text x="16" y="64" fill="#94A3B8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10">Apple：懂审美的独立创意专业人士</text>
  </g>

  <!-- Right 3 Internalization Cards -->
  <g transform="translate(534, 126)">
    <rect width="232" height="76" rx="10" fill="#111622" stroke="#00F2FE" stroke-opacity="0.6"/>
    <text x="16" y="25" fill="#00F2FE" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11.5" font-weight="bold">4. 品牌性格 (PERSONALITY)</text>
    <text x="16" y="45" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">假设品牌开口说话时的独特声线</text>
    <text x="16" y="64" fill="#94A3B8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10">Apple：克制、笃定、具备未来远见</text>
  </g>
  <g transform="translate(534, 219)">
    <rect width="232" height="76" rx="10" fill="#111622" stroke="#C084FC" stroke-opacity="0.6"/>
    <text x="16" y="25" fill="#C084FC" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11.5" font-weight="bold">5. 价值文化 (CULTURE)</text>
    <text x="16" y="45" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">支撑一切设计的底层价值信条</text>
    <text x="16" y="64" fill="#94A3B8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10">Apple：加州极客 × 包豪斯实用哲学</text>
  </g>
  <g transform="translate(534, 312)">
    <rect width="232" height="76" rx="10" fill="#111622" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="16" y="25" fill="#34D399" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="11.5" font-weight="bold">6. 自我映射 (SELF-IMAGE)</text>
    <text x="16" y="45" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">消费者买下它后内心的自我认同</text>
    <text x="16" y="64" fill="#94A3B8" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10">Apple：“非同凡响，拒绝平庸工具”</text>
  </g>

  <text x="780" y="464" fill="rgba(0, 242, 254, 0.45)" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="10" font-weight="bold" text-anchor="end">BRANDOS LAB™ // 品牌科学实验室</text>
</svg>
