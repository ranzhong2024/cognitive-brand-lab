<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="gridEp5Zh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowEp5Zh" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#09090B"/>
  <rect width="800" height="500" fill="url(#gridEp5Zh)"/>
  <rect width="800" height="500" fill="url(#glowEp5Zh)"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <text x="48" y="60" fill="#2DD4BF" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700">MARKETING &amp; GROWTH // 营销增长系列 · PART 05</text>
  <text x="752" y="60" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">2026.11.25</text>

  <text x="48" y="98" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21.5" font-weight="800">广告救不了坏体验，爆单也能拖垮现金流</text>
  <text x="48" y="122" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">品牌最容易忽略的“后端真相”：从 Starbucks、Amazon、Walmart 2026 财报到全美 19.3% 线上退货黑洞</text>

  <!-- Card 1: Starbucks Experience Bottleneck -->
  <rect x="48" y="148" width="224" height="236" rx="10" fill="#111622" stroke="#2DD4BF" stroke-opacity="0.5"/>
  <text x="64" y="176" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">01 // 卡点决定复购</text>
  <text x="64" y="212" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="28" font-weight="800">+7.7%</text>
  <text x="64" y="232" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Starbucks Q4 FY26 美国同店</text>
  <line x1="64" y1="248" x2="256" y2="248" stroke="#1E293B"/>
  <text x="64" y="272" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">死磕 4 分钟出杯 + 智能排单</text>
  <text x="64" y="294" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">翻新超 1,700 店 · 关停约 250 店</text>
  <text x="64" y="316" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Q4 核心营利率跳涨至 14.0%</text>
  <text x="64" y="366" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="10">FIX THE BOTTLENECK FIRST</text>

  <!-- Card 2: Amazon Profit vs Cash -->
  <rect x="288" y="148" width="224" height="236" rx="10" fill="#111622" stroke="#F43F5E" stroke-opacity="0.5"/>
  <text x="304" y="176" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">02 // 利润不等于活钱</text>
  <text x="304" y="212" fill="#FDA4AF" font-family="'Inter', sans-serif" font-size="28" font-weight="800">-$42.4B</text>
  <text x="304" y="232" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Amazon 过去 12 月自由现金流</text>
  <line x1="304" y1="248" x2="496" y2="248" stroke="#1E293B"/>
  <text x="304" y="272" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">单季营业利润大赚 $28.1B</text>
  <text x="304" y="294" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">近一年砸 $210.7B 资本开支</text>
  <text x="304" y="316" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">高毛利爆单垫货同样拉断资金</text>
  <text x="304" y="366" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10">PROFIT VS. BANK CASH</text>

  <!-- Card 3: Walmart Velocity & Returns -->
  <rect x="528" y="148" width="224" height="236" rx="10" fill="#111622" stroke="#38BDF8" stroke-opacity="0.5"/>
  <text x="544" y="176" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">03 // 流速与退货排雷</text>
  <text x="544" y="212" fill="#7DD3FC" font-family="'Inter', sans-serif" font-size="28" font-weight="800">19.3%</text>
  <text x="544" y="232" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">全美线上退货率（约 5 单退 1）</text>
  <line x1="544" y1="248" x2="736" y2="248" stroke="#1E293B"/>
  <text x="544" y="272" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">Walmart 超 80% 门店直发</text>
  <text x="544" y="294" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">3 小时急送 +50%+ · 电商 +23%</text>
  <text x="544" y="316" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">按款式批次物流切退货抓真凶</text>
  <text x="544" y="366" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">VELOCITY &amp; RETURNS AUDIT</text>

  <!-- Bottom Strip -->
  <rect x="48" y="400" width="704" height="38" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="400" y="424" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">前端广告只负责往池子里抽水；决定池子留不留得住人、账上断不断气的，永远是后端体验、流速与现金</text>

  <text x="48" y="458" fill="#52525B" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">RANBRANDOS.COM // 营销增长系列 · 第 5 篇</text>
  <text x="752" y="458" text-anchor="end" fill="#52525B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">SERIES 05/06 // ZH</text>
</svg>
