  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <text x="48" y="60" fill="#C4B5FD" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700">MARKETING &amp; GROWTH // 营销增长系列 · PART 06 FINALE</text>
  <text x="752" y="60" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">2026.11.25</text>

  <text x="48" y="98" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="800">为什么招来“全能总监”反而把品牌做散？</text>
  <text x="48" y="122" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">团队分工、考核陷阱与 AI 边界（附全系列 6 篇总复盘）· SharkNinja / Starbucks / Klarna 实证</text>

  <!-- Card 1: Org Alignment -->
  <rect x="48" y="148" width="224" height="236" rx="10" fill="#111622" stroke="#2DD4BF" stroke-opacity="0.5"/>
  <text x="64" y="176" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">01 // 围着顾客拆分工</text>
  <text x="64" y="212" fill="#5EEAD4" font-family="'Inter', 'Noto Sans SC', sans-serif" font-size="28" font-weight="800">14 季</text>
  <text x="64" y="232" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">SharkNinja 连续双位数增长</text>
  <line x1="64" y1="248" x2="256" y2="248" stroke="#1E293B"/>
  <text x="64" y="272" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">1,000+ 工程师与营销首日同桌</text>
  <text x="64" y="294" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">年推约 25 新品 · Q3 营收 +21.2%</text>
  <text x="64" y="316" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Starbucks 裁 2,000 总部补一线</text>
  <text x="64" y="366" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="10">FRONT-LINE ALIGNMENT</text>

  <!-- Card 2: Incentive Trap -->
  <rect x="288" y="148" width="224" height="236" rx="10" fill="#111622" stroke="#F43F5E" stroke-opacity="0.5"/>
  <text x="304" y="176" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">02 // 单指标考核反噬</text>
  <text x="304" y="212" fill="#FDA4AF" font-family="'Inter', sans-serif" font-size="28" font-weight="800">$3.0B</text>
  <text x="304" y="232" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Wells Fargo 考核失控联合和解</text>
  <line x1="304" y1="248" x2="496" y2="248" stroke="#1E293B"/>
  <text x="304" y="272" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">单压开户数酿超 350 万假账户</text>
  <text x="304" y="294" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">投放只看 ROAS 就狂打折抢老客</text>
  <text x="304" y="316" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">改用“主指标 + 底线锁”成对考核</text>
  <text x="304" y="366" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10">DUAL-GUARDRAIL INCENTIVES</text>

  <!-- Card 3: AI Boundaries -->
  <rect x="528" y="148" width="224" height="236" rx="10" fill="#111622" stroke="#F59E0B" stroke-opacity="0.5"/>
  <text x="544" y="176" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">03 // AI 落地真边界</text>
  <text x="544" y="212" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="26" font-weight="800">88% → 6%</text>
  <text x="544" y="232" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">企业启用 AI vs 真正拉动利润</text>
  <line x1="544" y1="248" x2="736" y2="248" stroke="#1E293B"/>
  <text x="544" y="272" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">赢家重塑流程概率近普通 3 倍</text>
  <text x="544" y="294" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Klarna 替 700 客服滑坡紧急回招</text>
  <text x="544" y="316" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">AI 干高频苦活 · 真人守 4 条底线</text>
  <text x="544" y="366" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="10">WORKFLOW BEFORE TOOLS</text>

  <!-- Bottom Strip -->
  <rect x="48" y="400" width="704" height="38" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="400" y="424" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">收官总复盘：拧紧需求渠道、客户定价、体验交付、利润现金与团队考核 5 颗齿轮，让时间替好品牌复利</text>

  <text x="48" y="458" fill="#52525B" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">RANBRANDOS.COM // 营销增长系列 · 第 6 篇（收官）</text>
  <text x="752" y="458" text-anchor="end" fill="#52525B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">SERIES 06/06 // ZH</text>
