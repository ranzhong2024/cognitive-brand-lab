  <text x="548" y="256" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">AI 对练成本降幅超 96%</text>
  <text x="548" y="277" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">单次 $0.30 → 不到 $0.01</text>
