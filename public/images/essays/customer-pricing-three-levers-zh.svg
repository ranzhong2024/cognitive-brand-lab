  <text x="64" y="177" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700">商品微利 + 会员筛客</text>
