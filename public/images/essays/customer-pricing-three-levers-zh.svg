  <text x="242" y="389" fill="#FCD34D" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="700">服务业务贡献全年总毛利</text>
  <rect x="242" y="396" width="230" height="12" rx="4" fill="#1E293B"/>
  <rect x="242" y="396" width="93" height="12" rx="4" fill="#F59E0B"/>
  <text x="478" y="406" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">40.2%</text>

  <line x1="534" y1="342" x2="534" y2="402" stroke="#1E293B"/>
  <text x="548" y="356" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">服务毛利率高达 76.2%</text>
  <text x="548" y="377" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">存储四档 $1,199 → $2,399</text>
  <text x="548" y="397" fill="#FCD34D" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">不直接打折 · 用换购分期降门槛</text>

  <!-- Footer Takeaway -->
  <rect x="48" y="428" width="704" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
  <text x="400" y="447" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">共同规律：低门槛入口做大盘子 → 清晰档位承接不同钱包 → 稳住正价标尺把单次交易滚成多年现金流</text>
