  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <!-- Header -->
  <text x="48" y="58" fill="#FB923C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PROFIT LEVERAGE LEDGER // 2026 一手财报对照</text>
  <text x="752" y="58" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5">FIGURE 01 · ZH</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="800">三家顶级公司的客户与定价账本：投入入口 vs 真实利润杠杆</text>
  <text x="48" y="109" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">行业完全不同，却都在用同一套非对称结构：少部分核心客与高毛利层扛起利润，入口层负责蓄水与信任</text>

  <!-- Row 1: Costco -->
  <rect x="48" y="128" width="704" height="88" rx="10" fill="#111622" stroke="#2DD4BF" stroke-opacity="0.45"/>
