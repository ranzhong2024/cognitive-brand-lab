  <text x="64" y="398" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">FY2026 10-K · 营收 $478.83B</text>

  <!-- Apple Bars -->
  <text x="242" y="352" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">软件与服务占总营收比例</text>
