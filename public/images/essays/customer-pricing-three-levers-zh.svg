  <text x="242" y="289" fill="#7DD3FC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="700">单季综合毛利率（超 91% 免费）</text>
