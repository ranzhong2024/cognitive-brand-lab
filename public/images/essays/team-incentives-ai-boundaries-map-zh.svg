<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="gridMap6Zh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#09090B"/>
  <rect width="800" height="500" fill="url(#gridMap6Zh)"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <!-- Header -->
  <text x="48" y="58" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">TEAM ROLES, INCENTIVES &amp; AI BOUNDARIES // 2026 实证对照</text>
  <text x="752" y="58" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5">FIGURE 01 · ZH</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.5" font-weight="800">2026 品牌组织分工、考核防坑与 AI 落地真边界对照</text>
  <text x="48" y="109" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">AI 只能放大已有秩序；先把分工压到一线、把考核锁进净利，再让 AI 接手高频标准苦活</text>

  <!-- Top Left: Enterprise AI ROI Gap -->
  <rect x="48" y="126" width="342" height="140" rx="10" fill="#111622" stroke="#F59E0B" stroke-opacity="0.45"/>
  <text x="64" y="150" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">A // 企业 AI 落地鸿沟（McKinsey &amp; BCG）</text>

  <text x="64" y="174" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">已在至少一个部门启用 AI 工具</text>
  <rect x="64" y="180" width="248" height="10" rx="4" fill="#1E293B"/>
  <rect x="64" y="180" width="218" height="10" rx="4" fill="#38BDF8"/>
  <text x="322" y="189" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">88%</text>

  <text x="64" y="211" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">真正转化成利润表实质增长的高绩效企业</text>
  <rect x="64" y="217" width="248" height="10" rx="4" fill="#1E293B"/>
  <rect x="64" y="217" width="18" height="10" rx="4" fill="#F43F5E"/>
  <text x="322" y="226" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">~6%</text>

  <text x="64" y="252" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">高达 <tspan fill="#FDA4AF" font-weight="700">95%</tspan> 试点难改利润表 · 赢家重构流程概率近 <tspan fill="#5EEAD4" font-weight="700">3 倍</tspan></text>

  <!-- Top Right: AI vs Human Boundary -->
  <rect x="410" y="126" width="342" height="140" rx="10" fill="#111622" stroke="#A78BFA" stroke-opacity="0.45"/>
  <text x="426" y="150" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">B // AI 交接区 vs 真人死守红线（Klarna 教训）</text>

  <rect x="426" y="162" width="148" height="68" rx="7" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="436" y="179" fill="#5EEAD4" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="800">AI 放心干（高频标准）</text>
  <text x="436" y="197" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">· 多语种初稿 / 差评聚类</text>
  <text x="436" y="215" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">· 物流问答 / 报表与仿真</text>

  <rect x="588" y="162" width="148" height="68" rx="7" fill="#0F172A" stroke="#F43F5E" stroke-opacity="0.5"/>
  <text x="598" y="179" fill="#FDA4AF" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="800">真人死守（利润信任）</text>
  <text x="598" y="197" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">· 战略取舍 / 定价促销权</text>
  <text x="598" y="215" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">· 品控担责 / 复杂情绪客诉</text>

  <text x="426" y="252" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">Klarna 用 AI 替 <tspan fill="#FCD34D" font-weight="700">700</tspan> 客服致质量滑坡，被迫回招走混合模式</text>

  <!-- Bottom Row: 3 Org & KPI Proofs -->
  <text x="48" y="292" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">C // 三大组织分工与考核实证（2025–2026 财报与美国司法部公开和解）</text>

  <!-- SharkNinja -->
  <rect x="48" y="304" width="224" height="110" rx="10" fill="#111622" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="64" y="328" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">SHARKNINJA · 跨职能协同</text>
  <text x="64" y="356" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="20" font-weight="800">+21.2%</text>
  <text x="256" y="355" text-anchor="end" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">Q3 2026 ($1.976B)</text>
  <text x="64" y="378" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">连续 14 季双位数 · 年推约 25 新品</text>
  <text x="64" y="398" fill="#FCD34D" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">1,000+ 工程师与营销首日同桌</text>

  <!-- Starbucks -->
  <rect x="288" y="304" width="224" height="110" rx="10" fill="#111622" stroke="#38BDF8" stroke-opacity="0.45"/>
  <text x="304" y="328" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">STARBUCKS · 总部补一线</text>
  <text x="304" y="356" fill="#7DD3FC" font-family="'Inter', 'Noto Sans SC', sans-serif" font-size="20" font-weight="800">$5 亿</text>
  <text x="496" y="355" text-anchor="end" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">砸进门店高峰工时</text>
  <text x="304" y="378" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">两轮精简约 2,000 个总部官僚岗</text>
  <text x="304" y="398" fill="#5EEAD4" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">Q4 美同店 +7.7% · 核心营利 14.0%</text>

  <!-- Wells Fargo -->
  <rect x="528" y="304" width="224" height="110" rx="10" fill="#111622" stroke="#F43F5E" stroke-opacity="0.45"/>
  <text x="544" y="328" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">WELLS FARGO · 考核反噬</text>
  <text x="544" y="356" fill="#FDA4AF" font-family="'Inter', sans-serif" font-size="20" font-weight="800">$3.0B</text>
  <text x="736" y="355" text-anchor="end" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">DOJ/SEC 联合和解</text>
  <text x="544" y="378" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">单压开户数酿超 350 万假账户</text>
  <text x="544" y="398" fill="#FCD34D" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">铁律：主指标必焊利润/口碑底线</text>

  <!-- Footer -->
  <rect x="48" y="428" width="704" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
  <text x="400" y="447" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">第 5 颗齿轮铁律：围着顾客拆分工，成对考核防拆台，AI 干苦活提效、真人守底线担责</text>
</svg>
