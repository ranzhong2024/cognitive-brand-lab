<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#09090B"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <text x="44" y="56" fill="#34D399" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">ECON LAB // 利润杠杆对比 (MARN &amp; ROSIELLO) × GBB 三碗面防套利矩阵</text>
  <text x="756" y="56" text-anchor="end" fill="#71717A" font-family="monospace" font-size="11">LEVERAGE MATRIX</text>

  <text x="44" y="88" fill="#F8FAFC" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="800">同样投入 1% 的精力：拉销量 vs 涨价 1% 的真实回报差</text>

  <!-- Left Half: Lever Comparison -->
  <rect x="44" y="114" width="320" height="316" rx="10" fill="#111827" stroke="#1E293B"/>
  <text x="64" y="142" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="700">麦肯锡 HBR 实证：+1% 变动对营业利润弹性</text>

  <!-- Price +1% -> +11.1% -->
  <text x="64" y="182" fill="#34D399" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">实际净价 +1%（Price Improvement）</text>
  <rect x="64" y="192" width="266" height="34" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="320" y="214" text-anchor="end" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="800">+11.1%</text>

  <!-- Volume +1% -> +3.3% -->
  <text x="64" y="256" fill="#FBBF24" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">销量规模 +1%（Unit Volume）</text>
  <rect x="64" y="266" width="82" height="34" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="158" y="288" fill="#FDE68A" font-family="monospace" font-size="14" font-weight="700">+3.3%</text>

  <!-- Highlight Box -->
  <rect x="64" y="322" width="280" height="88" rx="6" fill="#09090B" stroke="#334155"/>
  <text x="76" y="344" fill="#34D399" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">核心结论：价格杠杆 ≈ 销量杠杆 3.4 倍</text>
  <text x="76" y="365" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">· 盲目降价 10% 抢量，往往需要销量翻倍才能打平利润</text>
  <text x="76" y="384" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">· S&amp;P 1500 后续长期研究同样验证 +8%~+10% 利润杠杆</text>

  <!-- Right Half: 4 Fences + WTP -->
  <rect x="382" y="114" width="374" height="316" rx="10" fill="#111827" stroke="#1E293B"/>
  <text x="402" y="142" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="700">防止富人向下套利的 4 道隔离墙 (4 Price Fences)</text>

  <rect x="402" y="160" width="160" height="72" rx="6" fill="#09090B" stroke="#334155"/>
  <text x="414" y="180" fill="#34D399" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700">① 资质与身份隔离</text>
  <text x="414" y="198" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">学生/首单订阅/老客内购</text>
  <text x="414" y="214" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">不破坏官网标准锚定价格</text>

  <rect x="576" y="160" width="160" height="72" rx="6" fill="#09090B" stroke="#334155"/>
  <text x="588" y="180" fill="#34D399" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700">② 时间与紧迫度隔离</text>
  <text x="588" y="198" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">早鸟预售 14 天交付延迟</text>
  <text x="588" y="214" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">现货极速达支付时间溢价</text>

  <rect x="402" y="244" width="160" height="72" rx="6" fill="#09090B" stroke="#334155"/>
  <text x="414" y="264" fill="#34D399" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700">③ 批量与绑定门槛</text>
  <text x="414" y="282" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">单件高毛利 + 3 件家庭套</text>
  <text x="414" y="298" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">拉升客单价摊薄头程快递</text>

  <rect x="576" y="244" width="160" height="72" rx="6" fill="#09090B" stroke="#334155"/>
  <text x="588" y="264" fill="#FBBF24" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700">④ 核心物理参数阉割</text>
  <text x="588" y="282" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">如 Apple 存储容量阶梯差</text>
  <text x="588" y="298" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">确保重度买家不可向下替代</text>

  <!-- WTP Measurement Triad -->
  <rect x="402" y="330" width="334" height="80" rx="6" fill="#064E3B" fill-opacity="0.28" stroke="#10B981" stroke-opacity="0.7"/>
  <text x="414" y="352" fill="#6EE7B7" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">拒绝拍脑袋：三大 WTP 实证测量量尺</text>
  <text x="414" y="373" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">1. Van Westendorp (PSM)：四问法锁定心理可接受上下界</text>
  <text x="414" y="393" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">2. Gabor-Granger 弹性测试  ×  3. Conjoint 拆解卖点美金值</text>

  <text x="44" y="458" fill="#52525B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">BRANDOS LAB™ // 品牌科学实验室™ · 来源：Marn &amp; Rosiello (1992 HBR) × Rafi Mohammed GBB</text>
  <text x="756" y="458" text-anchor="end" fill="#52525B" font-family="monospace" font-size="11">FIG. M3-02</text>
</svg>
