<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" role="img" aria-label="Ehrenberg-Bass Growth Flywheel and Double Jeopardy Law">
  <rect width="800" height="460" rx="16" fill="#09090B" stroke="#232B3E"/>
  <text x="400" y="235" fill="rgba(255, 255, 255, 0.03)" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle" transform="rotate(-8 400 235)" letter-spacing="4">BRANDOS LAB™ // COGNITIVE BRAND SCIENCE</text>

  <text x="400" y="40" fill="#FAFAFA" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">Ehrenberg-Bass Growth Flywheel &amp; The Double Jeopardy Law</text>
  <text x="400" y="62" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">MARKET SHARE GROWS VIA PENETRATION (LIGHT BUYERS) × MENTAL AVAILABILITY × PHYSICAL AVAILABILITY</text>

  <!-- Left Panel: Growth Formula + Liquid Death -->
  <g transform="translate(38, 86)">
    <rect width="352" height="332" rx="14" fill="#111622" stroke="#00F2FE" stroke-width="1.8"/>
    <text x="20" y="34" fill="#00F2FE" font-family="monospace" font-size="12" font-weight="bold">⚡ GROWTH MULTIPLICATIVE ENGINE</text>

    <rect x="20" y="52" width="312" height="78" rx="10" fill="#09090B" stroke="#232B3E"/>
    <text x="34" y="76" fill="#38BDF8" font-family="sans-serif" font-size="13.5" font-weight="bold">1. Mental Availability (CEPs + DBAs)</text>
    <text x="34" y="96" fill="#CBD5E1" font-family="sans-serif" font-size="12">Viral punk storytelling grabs attention across</text>
    <text x="34" y="114" fill="#94A3B8" font-family="sans-serif" font-size="11.5">100M+ TikTok &amp; YouTube views organically.</text>

    <text x="176" y="148" fill="#00F2FE" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">×</text>

    <rect x="20" y="158" width="312" height="78" rx="10" fill="#09090B" stroke="#232B3E"/>
    <text x="34" y="182" fill="#34D399" font-family="sans-serif" font-size="13.5" font-weight="bold">2. Physical Availability (Zero Friction)</text>
    <text x="34" y="202" fill="#CBD5E1" font-family="sans-serif" font-size="12">Omnichannel presence in Whole Foods, Target,</text>
    <text x="34" y="220" fill="#94A3B8" font-family="sans-serif" font-size="11.5">7-Eleven &amp; Walmart so buyers grab on impulse.</text>

    <rect x="20" y="252" width="312" height="62" rx="10" fill="#0D1F1A" stroke="#10B981"/>
    <text x="34" y="276" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="bold">BENCHMARK: LIQUID DEATH</text>
    <text x="34" y="298" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">100,000+ Retail Doors → $1.4B Valuation</text>
  </g>

  <!-- Right Panel: Double Jeopardy Trap -->
  <g transform="translate(410, 86)">
    <rect width="352" height="332" rx="14" fill="#111622" stroke="#F43F5E" stroke-width="1.8"/>
    <text x="20" y="34" fill="#FB7185" font-family="monospace" font-size="12" font-weight="bold">⚠️ DOUBLE JEOPARDY TRAP</text>

    <rect x="20" y="52" width="312" height="102" rx="10" fill="#18111A" stroke="#7F1D1D"/>
    <text x="34" y="76" fill="#FCA5A5" font-family="sans-serif" font-size="13.5" font-weight="bold">Why "1,000 True Fans" Hits a Wall</text>
    <text x="34" y="98" fill="#E2E8F0" font-family="sans-serif" font-size="12">Small brands suffer twice: smaller buyer base</text>
    <text x="34" y="116" fill="#E2E8F0" font-family="sans-serif" font-size="12">AND lower purchase frequency than leaders.</text>
    <text x="34" y="138" fill="#F87171" font-family="monospace" font-size="11">Retention alone cannot scale a small base.</text>

    <rect x="20" y="170" width="312" height="144" rx="10" fill="#09090B" stroke="#232B3E"/>
    <text x="34" y="196" fill="#34D399" font-family="sans-serif" font-size="13.5" font-weight="bold">Empirical Prescription (BrandOS Path)</text>
    <text x="34" y="220" fill="#CBD5E1" font-family="sans-serif" font-size="12">✓ Prioritize broad category penetration first</text>
    <text x="34" y="242" fill="#CBD5E1" font-family="sans-serif" font-size="12">✓ Capture 1–2x/yr light buyers at scale</text>
    <text x="34" y="264" fill="#CBD5E1" font-family="sans-serif" font-size="12">✓ Refresh memory cues consistently (DBAs)</text>
    <text x="34" y="292" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">Bigger Base Naturally Lifts Repeat Rate</text>
  </g>

  <text x="780" y="444" fill="rgba(0, 242, 254, 0.45)" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">BRANDOS LAB™ // COGNITIVE BRAND SCIENCE</text>
</svg>
