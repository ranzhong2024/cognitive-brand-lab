  <text x="466" y="236" text-anchor="middle" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">联动 M1 场景</text>

  <rect x="528" y="160" width="96" height="90" rx="6" fill="#09090B" stroke="#334155"/>
  <text x="576" y="196" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="24" font-weight="800">3</text>
  <text x="576" y="220" text-anchor="middle" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700">异构人设创作者</text>
  <text x="576" y="236" text-anchor="middle" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">专家/素人/重度粉</text>

  <rect x="638" y="160" width="98" height="90" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#10B981"/>
  <text x="687" y="196" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="24" font-weight="800">6</text>
  <text x="687" y="220" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700">3 秒 Hook 变体</text>
  <text x="687" y="236" text-anchor="middle" fill="#A7F3D0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">喂饱 Andromeda</text>

  <!-- Brand Cases -->
  <rect x="418" y="268" width="318" height="146" rx="6" fill="#09090B" stroke="#334155"/>
  <text x="432" y="290" fill="#FBBF24" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">2024-2026 验证品牌增长标杆</text>
  <text x="432" y="314" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.2" font-weight="700">· HexClad：$5.5亿+ 年营收 / $10亿+ 估值</text>
  <text x="440" y="331" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5">Ramsay 股权合伙 + 2024.7 $1亿注资 + 酷刑实测</text>
  <text x="432" y="355" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.2" font-weight="700">· True Classic：$2.5亿~$3亿+ 年营收规模</text>
  <text x="440" y="372" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5">接地气搞笑痛点 + 高频 6 钩子 UGC 突破红海</text>
  <text x="432" y="396" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.2" font-weight="700">· Ridge Wallet：$3亿+ 累计销售额（跨圈对比）</text>

  <text x="44" y="458" fill="#52525B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">BRANDOS LAB™ // 品牌科学实验室™ · 数据源：Jonah Berger STEPPS · 公开商业披露</text>
