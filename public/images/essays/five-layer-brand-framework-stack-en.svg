<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Five-Layer Brand Framework Architecture Blueprint">
  <rect width="800" height="500" rx="16" fill="#09090B" stroke="#232B3E"/>

  <!-- Watermark -->
  <text x="400" y="255" fill="rgba(255, 255, 255, 0.03)" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle" transform="rotate(-8 400 255)" letter-spacing="4">BRANDOS LAB™ // COGNITIVE BRAND SCIENCE</text>

  <text x="400" y="40" fill="#FAFAFA" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">From 0 to 1 Full-Stack Brand Architecture (5 Engineering Layers)</text>
  <text x="400" y="62" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">BOTTOM-UP CAUSAL BUILD: STRATEGY → IDENTITY → EQUITY → DISTRIBUTION → GOVERNANCE</text>

  <!-- L5 Apex -->
  <g transform="translate(36, 84)">
    <rect width="728" height="68" rx="10" fill="#1F1A0D" stroke="#FBBF24" stroke-width="1.8"/>
    <text x="20" y="26" fill="#FDE68A" font-family="monospace" font-size="12" font-weight="bold">LAYER 05 · GOVERNANCE &amp; DASHBOARD</text>
    <text x="708" y="26" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">KPIs: SOS · NPS · Price Premium</text>
    <text x="20" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Masterbrand vs. House of Brands • Leading Equity Health Metrics</text>
  </g>

  <!-- L4 -->
  <g transform="translate(36, 162)">
    <rect width="728" height="68" rx="10" fill="#0D1F1A" stroke="#10B981" stroke-width="1.8"/>
    <text x="20" y="26" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="bold">LAYER 04 · GROWTH &amp; DISTRIBUTION</text>
    <text x="708" y="26" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">CASE: Liquid Death ($1.4B, 100K+ Stores)</text>
    <text x="20" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Mental × Physical Availability • Beat Double Jeopardy via Broad Penetration</text>
  </g>

  <!-- L3 -->
  <g transform="translate(36, 240)">
    <rect width="728" height="68" rx="10" fill="#191326" stroke="#C084FC" stroke-width="1.8"/>
    <text x="20" y="26" fill="#E9D5FF" font-family="monospace" font-size="12" font-weight="bold">LAYER 03 · CBBE RESONANCE PYRAMID</text>
    <text x="708" y="26" fill="#C084FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">CASE: Warby Parker ($95 + 5 Home Try-On)</text>
    <text x="20" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Salience → Performance/Imagery → Judgments/Feelings → Resonance (POPs vs. PODs)</text>
  </g>

  <!-- L2 -->
  <g transform="translate(36, 318)">
    <rect width="728" height="68" rx="10" fill="#13162A" stroke="#818CF8" stroke-width="1.8"/>
    <text x="20" y="26" fill="#C7D2FE" font-family="monospace" font-size="12" font-weight="bold">LAYER 02 · IDENTITY &amp; DISTINCTIVE ASSETS</text>
    <text x="708" y="26" fill="#818CF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">ASSETS: Apple · Nike · Tiffany Blue · Coke</text>
    <text x="20" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Kapferer 6-Facet Identity Prism · 12 Jungian Archetypes · Non-Word DBAs</text>
  </g>

  <!-- L1 Base -->
  <g transform="translate(36, 396)">
    <rect width="728" height="68" rx="10" fill="#0B1924" stroke="#00F2FE" stroke-width="2"/>
    <text x="20" y="26" fill="#00F2FE" font-family="monospace" font-size="12" font-weight="bold">LAYER 01 · STRATEGY &amp; COGNITIVE PRIMITIVES</text>
    <text x="708" y="26" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">CASE: Patagonia · Athletic Brewing (50%+)</text>
    <text x="20" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Golden Circle (Why/How/What) · Category Entry Points (CEPs) · Jobs-To-Be-Done (JTBD)</text>
  </g>

  <text x="780" y="486" fill="rgba(0, 242, 254, 0.45)" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">BRANDOS LAB™ // COGNITIVE BRAND SCIENCE</text>
</svg>
