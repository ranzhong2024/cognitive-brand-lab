<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="gridMap4Zh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#09090B"/>
  <rect width="800" height="500" fill="url(#gridMap4Zh)"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <!-- Header -->
  <text x="48" y="58" fill="#FB923C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">INCREMENTALITY &amp; RETAIL MEDIA LEDGER // 2026 实证对照</text>
  <text x="752" y="58" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5">FIGURE 01 · ZH</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.5" font-weight="800">平台 ROAS 幻觉 vs 2026 美国三大零售媒体抽水账本</text>
  <text x="48" y="109" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">一边是停投后才露馅的虚高投产比，一边是零售巨头靠 70%–80%+ 高毛利站内广告补齐商品利润</text>

  <!-- Top Left: Ad-Cut Reality -->
  <rect x="48" y="126" width="342" height="140" rx="10" fill="#111622" stroke="#F43F5E" stroke-opacity="0.45"/>
  <text x="64" y="150" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">A // 停投实证：砍掉广告后发生了什么？</text>

  <text x="64" y="174" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">eBay 停投品牌词 → 免费自然承接</text>
  <rect x="64" y="180" width="248" height="10" rx="4" fill="#1E293B"/>
  <rect x="64" y="180" width="247" height="10" rx="4" fill="#F43F5E"/>
  <text x="320" y="189" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">99.5%</text>

  <text x="64" y="209" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">Airbnb 砍超 $6 亿 → 网站流量回升</text>
  <rect x="64" y="215" width="248" height="10" rx="4" fill="#1E293B"/>
  <rect x="64" y="215" width="236" height="10" rx="4" fill="#FB923C"/>
  <text x="320" y="224" fill="#FDBA74" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">95.0%</text>

  <text x="64" y="247" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">Uber 砍 2/3 拉新广告 ($1 亿) → 新客安装量</text>
  <text x="374" y="247" text-anchor="end" fill="#5EEAD4" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="700">几乎未降</text>

