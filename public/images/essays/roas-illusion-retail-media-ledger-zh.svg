  <rect x="588" y="164" width="148" height="62" rx="7" fill="#0F172A" stroke="#F43F5E" stroke-opacity="0.5"/>
  <text x="600" y="182" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">加倍到 $10 万（倒亏）</text>
  <text x="600" y="202" fill="#FDA4AF" font-family="'Inter', sans-serif" font-size="15" font-weight="800">-$1.0 万亏损</text>
  <text x="600" y="218" fill="#64748B" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">后 $5 万仅多拉 $3 万真新单</text>

  <text x="426" y="249" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">后台把 $22 万自然单划给自己 → 仍报 <tspan fill="#FCD34D" font-weight="800">4.0x 平均 ROAS</tspan></text>

  <!-- Bottom Row: 3 Retail Giants -->
  <text x="48" y="292" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">C // 2026 美国三大零售巨头站内广告账本（全美盘子 ~$71B · 零售卖货净利 3–4% vs 广告毛利 70–80%+）</text>

  <!-- Amazon -->
