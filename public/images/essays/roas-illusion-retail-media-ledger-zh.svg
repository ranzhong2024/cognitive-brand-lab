  <rect x="410" y="126" width="342" height="140" rx="10" fill="#111622" stroke="#38BDF8" stroke-opacity="0.45"/>
  <text x="426" y="150" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">B // 扩量暗墙（50% 商品毛利示例）</text>

  <rect x="426" y="164" width="148" height="62" rx="7" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="438" y="182" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">月投 $5 万（稳赚）</text>
  <text x="438" y="202" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="15" font-weight="800">+$2.5 万净利</text>
