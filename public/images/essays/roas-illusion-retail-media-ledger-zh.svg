  <text x="64" y="356" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="22" font-weight="800">$56.7B</text>
  <text x="150" y="355" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">2026 前 9 个月</text>
  <text x="64" y="378" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">占美零售广告近 79.7% 份额</text>
  <text x="64" y="398" fill="#FDA4AF" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">卖家 CPC +10–15% · ACoS 30–38%</text>

  <!-- Walmart -->
  <rect x="288" y="304" width="224" height="110" rx="10" fill="#111622" stroke="#38BDF8" stroke-opacity="0.45"/>
  <text x="304" y="328" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">WALMART · 利润加速</text>
  <text x="304" y="356" fill="#7DD3FC" font-family="'Inter', sans-serif" font-size="22" font-weight="800">+36%</text>
  <text x="378" y="355" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">Connect (Q3 FY27)</text>
  <text x="304" y="378" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">美总广告 +37%（含 VIZIO 电视）</text>
  <text x="304" y="398" fill="#5EEAD4" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">美国营利 +9.0% 近营收(+5.2%)两倍</text>

  <!-- Best Buy -->
  <rect x="528" y="304" width="224" height="110" rx="10" fill="#111622" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="544" y="328" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">BEST BUY · 广告补毛利</text>
  <text x="544" y="356" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="22" font-weight="800">24.1%</text>
  <text x="622" y="355" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">美毛利率 (+80bps)</text>
  <text x="544" y="378" fill="#CBD5E1" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">同店 +6.1% 创五年新高</text>
  <text x="544" y="398" fill="#FCD34D" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">站内广告与 $350M 平台补硬件毛利</text>

  <!-- Footer -->
  <rect x="48" y="428" width="704" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
  <text x="400" y="447" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">算账底线：把品牌防御费与真拉新表拆开，用全盘净毛利 + 14 天停投对照把主动权抢回来</text>
