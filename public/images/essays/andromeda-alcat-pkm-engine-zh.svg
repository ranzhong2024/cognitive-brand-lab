<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#09090B"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <text x="44" y="56" fill="#34D399" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">MECHANISM // ANDROMEDA AL-CAT 定向机制 × PKM 创作者白标套利漏斗</text>
  <text x="756" y="56" text-anchor="end" fill="#71717A" font-family="monospace" font-size="11">SYSTEM PIPELINE</text>

  <text x="44" y="88" fill="#F8FAFC" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="800">现代拍卖算法与人脑防御盾的双重穿越路线图</text>

  <!-- Layer 1: Andromeda -->
  <rect x="44" y="114" width="220" height="316" rx="8" fill="#111827" stroke="#10B981" stroke-opacity="0.6"/>
  <text x="60" y="140" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">STEP 01 // AL-CAT</text>
  <text x="60" y="162" fill="#F8FAFC" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="800">素材即算法语义探针</text>
  <text x="60" y="182" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">Andromeda MoE + GH200</text>

  <rect x="60" y="200" width="188" height="54" rx="5" fill="#09090B" stroke="#334155"/>
  <text x="72" y="220" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700">前 3 秒视听 Hook 提取</text>
  <text x="72" y="238" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">自动识别受众停留/声音/痛点</text>

  <rect x="60" y="264" width="188" height="54" rx="5" fill="#09090B" stroke="#334155"/>
  <text x="72" y="284" fill="#E2E8F0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700">1B+ 候选广告实时打分</text>
  <text x="72" y="302" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">吞吐 ~100x · 召回 +6% · 质量 +8%</text>

  <rect x="60" y="328" width="188" height="82" rx="5" fill="#064E3B" fill-opacity="0.35" stroke="#10B981"/>
  <text x="72" y="348" fill="#6EE7B7" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700">为什么不能切细兴趣组？</text>
  <text x="72" y="366" fill="#CBD5E1" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">细切 Ad Set 锁定水池上限，</text>
  <text x="72" y="382" fill="#CBD5E1" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">给 Broad 大池放权才能匹配最优买家</text>

  <path d="M 272 272 L 288 272" stroke="#10B981" stroke-width="2"/>
  <polygon points="286,267 294,272 286,277" fill="#10B981"/>

  <!-- Layer 2: PKM vs PSI -->
  <rect x="296" y="114" width="234" height="316" rx="8" fill="#111827" stroke="#F59E0B" stroke-opacity="0.6"/>
  <text x="312" y="140" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="700">STEP 02 // HUMAN BRAIN</text>
  <text x="312" y="162" fill="#F8FAFC" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="800">绕开人类说服知识防御盾</text>
  <text x="312" y="182" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">PKM 防御 (1994) vs PSI 关系 (1956)</text>

  <rect x="312" y="200" width="202" height="90" rx="5" fill="#450A0A" fill-opacity="0.55" stroke="#EF4444"/>
  <text x="324" y="220" fill="#FCA5A5" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700">官方号自夸路径（受阻）</text>
  <text x="324" y="240" fill="#FECACA" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">识别为“卖货广告” → 唤醒 PKM</text>
  <text x="324" y="258" fill="#FECACA" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">产生反感质疑 → 50ms 内秒划走</text>
  <text x="324" y="276" fill="#F87171" font-family="monospace" font-size="10">疲劳极值：Frequency 3~4</text>

  <rect x="312" y="302" width="202" height="108" rx="5" fill="#064E3B" fill-opacity="0.4" stroke="#10B981"/>
  <text x="324" y="322" fill="#34D399" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700">创作者白标号路径（畅通）</text>
  <text x="324" y="342" fill="#D1FAE5" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">真人头像/口吻触发熟人 PSI 信赖</text>
  <text x="324" y="360" fill="#D1FAE5" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">大幅延后商业防备，完整看完实测</text>
  <text x="324" y="382" fill="#6EE7B7" font-family="monospace" font-size="10.5" font-weight="700">双信号耐受：Frequency 6~8</text>
  <text x="324" y="398" fill="#A7F3D0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">CTR 提升 +53% ~ +180%</text>

  <path d="M 538 272 L 554 272" stroke="#10B981" stroke-width="2"/>
  <polygon points="552,267 560,272 552,277" fill="#10B981"/>

  <!-- Layer 3: Verified Lift -->
  <rect x="562" y="114" width="194" height="316" rx="8" fill="#111827" stroke="#334155"/>
  <text x="578" y="140" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">STEP 03 // P&amp;L OUTPUT</text>
  <text x="578" y="162" fill="#F8FAFC" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="800">实证利润增量产出</text>

  <rect x="578" y="188" width="162" height="52" rx="5" fill="#09090B" stroke="#10B981"/>
  <text x="659" y="210" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="16" font-weight="800">~63%</text>
  <text x="659" y="228" text-anchor="middle" fill="#CBD5E1" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">净新增增量人群触达</text>

  <rect x="578" y="250" width="162" height="52" rx="5" fill="#09090B" stroke="#10B981"/>
  <text x="659" y="272" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="16" font-weight="800">-19%~-40%</text>
  <text x="659" y="290" text-anchor="middle" fill="#CBD5E1" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">跨行业综合 CPA 下降</text>

  <rect x="578" y="312" width="162" height="52" rx="5" fill="#09090B" stroke="#10B981"/>
  <text x="659" y="334" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="15" font-weight="800">+10%~+15%</text>
  <text x="659" y="352" text-anchor="middle" fill="#CBD5E1" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">点击后落地页 CVR 溢出</text>

  <text x="578" y="392" fill="#94A3B8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">最终裁决尺：POAS（广告贡献毛利）</text>
  <text x="578" y="408" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">联动 M6 Holdout 停投实验验证</text>

  <text x="44" y="458" fill="#52525B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">BRANDOS LAB™ // 品牌科学实验室™ · 数据源：Meta Andromeda Engineering · Friestad &amp; Wright (1994)</text>
  <text x="756" y="458" text-anchor="end" fill="#52525B" font-family="monospace" font-size="11">FIG. M4-01</text>
</svg>
