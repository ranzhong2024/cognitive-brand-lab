<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowPurple" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#09090B"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glowPurple)"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#27272A" stroke-width="1.5"/>
  <text x="48" y="58" fill="#C084FC" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700">FORENSIC AUDIT // 平台相关性归因幻觉 vs RUBIN 反事实因果增量实验</text>
  <text x="752" y="58" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">CAUSAL INCREMENTALITY</text>

  <text x="48" y="90" fill="#F8FAFC" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19.5" font-weight="800">为什么后台 ROAS 4.0，公司现金流却越投越亏？三场震动业界的停投实验</text>
  <text x="48" y="112" fill="#94A3B8" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">Donald Rubin 潜在结果模型：未设 Holdout 对照组，所有后台归因都在把自然流量算作广告功劳</text>

  <!-- 3 Evidence Cards -->
  <rect x="48" y="134" width="466" height="80" rx="7" fill="#111622" stroke="#EF4444" stroke-opacity="0.6"/>
  <text x="64" y="158" fill="#FCA5A5" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800">1. eBay “T-Rex” 实验 (Blake, Nosko, Tadelis · Econometrica 2015)</text>
  <text x="64" y="180" fill="#CBD5E1" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">• 归因幻觉：传统回归声称非品牌搜索广告 ROI 达 4,000%</text>
  <text x="64" y="199" fill="#F87171" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">• 因果真相：地理随机停投实测 ROI 为 -63%；关停品牌词 99.5% 点击回流自然搜索</text>

  <rect x="48" y="226" width="466" height="80" rx="7" fill="#111622" stroke="#F59E0B" stroke-opacity="0.6"/>
  <text x="64" y="250" fill="#FCD34D" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800">2. Airbnb 疫情全线砍投黑盒破解 (2020–2021)</text>
  <text x="64" y="272" fill="#CBD5E1" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">• 极端压力测试：砍掉超 6 亿美元总营销预算（重砍效果竞价）</text>
  <text x="64" y="291" fill="#FBBF24" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">• 因果真相：广告未重启前流量已恢复至 2019 年的 95%，约 91% 属直接/自然访问</text>

  <rect x="48" y="318" width="466" height="80" rx="7" fill="#111622" stroke="#A855F7" stroke-opacity="0.6"/>
  <text x="64" y="342" fill="#E9D5FF" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800">3. Uber $100M–$120M 归因劫持抓包 (Kevin Frisch · 2017)</text>
  <text x="64" y="364" fill="#CBD5E1" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">• 流氓作弊：工具类 App 在用户自然安装前 2 秒后台伪造“最后一次点击”</text>
  <text x="64" y="383" fill="#C084FC" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">• 因果真相：分批砍掉约 2/3 预算（$100M-$120M），App 总安装量纹丝不动</text>

  <!-- Right BrandOS Protocol Column -->
  <rect x="530" y="134" width="222" height="264" rx="8" fill="#2E1065" fill-opacity="0.4" stroke="#A855F7" stroke-width="1.5"/>
  <text x="641" y="162" text-anchor="middle" fill="#E9D5FF" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="800">BrandOS™ M6 因果闸门</text>

  <rect x="544" y="178" width="194" height="62" rx="5" fill="#09090B" stroke="#A855F7" stroke-opacity="0.5"/>
  <text x="554" y="198" fill="#C084FC" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700">1. Meta GeoLift 合成控制</text>
  <text x="554" y="216" fill="#CBD5E1" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">用未投放配对州/市合成</text>
  <text x="554" y="230" fill="#CBD5E1" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">反事实 Y(0) 基准线</text>

  <rect x="544" y="250" width="194" height="62" rx="5" fill="#09090B" stroke="#A855F7" stroke-opacity="0.5"/>
  <text x="554" y="270" fill="#C084FC" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700">2. SUTVA 隔离防污染</text>
  <text x="554" y="288" fill="#CBD5E1" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">确保实验区与留白对照区</text>
  <text x="554" y="302" fill="#CBD5E1" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">地理隔离与独立折扣码</text>

  <rect x="544" y="322" width="194" height="62" rx="5" fill="#064E3B" fill-opacity="0.45" stroke="#10B981"/>
  <text x="554" y="342" fill="#6EE7B7" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="800">3. iROAS &amp; MER 红线</text>
  <text x="554" y="360" fill="#E2E8F0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700">iROAS &gt;= 1.20</text>
  <text x="554" y="375" fill="#E2E8F0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700">MER 3.5 – 5.0</text>

  <rect x="48" y="408" width="704" height="30" rx="5" fill="#18181B" stroke="#27272A"/>
  <text x="64" y="427" fill="#E9D5FF" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700">财务底线：如果平台显示 ROAS=3.8 但品牌词 Holdout 显示 95% 会自然成交，那广告预算本质是在给平台交“自然流税”</text>

  <text x="48" y="458" fill="#52525B" font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">BRANDOS LAB™ // 品牌科学实验室™ · 因果增量实验证据板</text>
  <text x="752" y="458" text-anchor="end" fill="#52525B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">FIG. M6-01</text>
</svg>