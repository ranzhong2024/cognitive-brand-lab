<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="From 0 to 1 Full-Stack Brand Framework 5-Layer Architecture Cover">
  <defs>
    <linearGradient id="bgGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="55%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <radialGradient id="cyanAuraEn" cx="72%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGradEn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="spineGradEn" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="swissGridEn" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148, 163, 184, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradEn)"/>
  <rect width="800" height="500" fill="url(#swissGridEn)"/>
  <rect width="800" height="500" fill="url(#cyanAuraEn)"/>
  <rect x="16" y="16" width="768" height="468" rx="14" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Top Telemetry Header -->
  <rect x="44" y="38" width="232" height="26" rx="13" fill="rgba(0, 242, 254, 0.09)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1"/>
  <circle cx="60" cy="51" r="3.5" fill="#00F2FE"/>
  <text x="72" y="55" fill="#00F2FE" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">M1 // BRAND ARCHITECTURE</text>
  <text x="752" y="55" fill="#64748B" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end" letter-spacing="1.2">FIELD OBSERVATION · 01</text>
  <line x1="44" y1="80" x2="756" y2="80" stroke="#1E293B" stroke-width="1"/>

