  <text x="44" y="176" fill="#F8FAFC" font-family="sans-serif" font-size="40" font-weight="900">From 0 to 1</text>
  <text x="44" y="220" fill="#F8FAFC" font-family="sans-serif" font-size="30" font-weight="900">5-Layer Brand Stack</text>
  <rect x="46" y="246" width="132" height="3.5" rx="2" fill="url(#beamGradEn)"/>

  <!-- 3 Core Scientific Pillars -->
  <g transform="translate(46, 282)">
    <rect x="0" y="0" width="342" height="38" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="18" cy="19" r="4.5" fill="#00F2FE"/>
    <text x="34" y="23" fill="#E2E8F0" font-family="sans-serif" font-size="13.5" font-weight="bold">Keller CBBE Pyramid</text>
    <text x="326" y="23" fill="#38BDF8" font-family="monospace" font-size="10.5" text-anchor="end">MEMORY NET</text>

    <rect x="0" y="48" width="342" height="38" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="18" cy="67" r="4.5" fill="#818CF8"/>
    <text x="34" y="71" fill="#E2E8F0" font-family="sans-serif" font-size="13.5" font-weight="bold">Byron Sharp Availability</text>
    <text x="326" y="71" fill="#A5B4FC" font-family="monospace" font-size="10.5" text-anchor="end">GROWTH LAW</text>

    <rect x="0" y="96" width="342" height="38" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="18" cy="115" r="4.5" fill="#10B981"/>
