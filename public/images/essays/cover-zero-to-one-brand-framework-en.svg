    <polygon points="165,12 159,24 171,24" fill="#FBBF24"/>

    <polygon points="75,32 255,32 272,72 58,72" fill="rgba(251, 191, 36, 0.14)" stroke="#FBBF24" stroke-width="1.8"/>
    <text x="165" y="56" fill="#FDE68A" font-family="sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">L5 · Governance &amp; Equity</text>

    <polygon points="56,88 274,88 290,128 40,128" fill="rgba(16, 185, 129, 0.14)" stroke="#34D399" stroke-width="1.8"/>
    <text x="165" y="112" fill="#A7F3D0" font-family="sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">L4 · Mental × Physical Scale</text>

    <polygon points="38,144 292,144 308,184 22,184" fill="rgba(192, 132, 252, 0.14)" stroke="#C084FC" stroke-width="1.8"/>
    <text x="165" y="168" fill="#E9D5FF" font-family="sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">L3 · CBBE Resonance Ladder</text>

