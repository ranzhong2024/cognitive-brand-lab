  <line x1="44" y1="448" x2="756" y2="448" stroke="#1E293B" stroke-width="1"/>
  <text x="46" y="470" fill="#64748B" font-family="monospace" font-size="11">CASES: LIQUID DEATH · PATAGONIA · WARBY PARKER</text>
  <text x="754" y="470" fill="rgba(0, 242, 254, 0.55)" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">BRANDOS LAB™ // COGNITIVE BRAND SCIENCE</text>
