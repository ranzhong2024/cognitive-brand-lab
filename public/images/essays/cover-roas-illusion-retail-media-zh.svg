  <text x="304" y="316" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Best Buy 用广告补硬件毛利</text>
  <text x="304" y="366" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="10">HIGH-MARGIN SHELF RENT</text>

