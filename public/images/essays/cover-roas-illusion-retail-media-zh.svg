  <text x="64" y="294" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Uber 砍 $1 亿安装量纹丝不动</text>
  <text x="64" y="316" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">Airbnb 砍超 $6 亿流量回 95%</text>
  <text x="64" y="366" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10">ATTRIBUTION MIRAGE</text>

