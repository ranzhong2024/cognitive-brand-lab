  <text x="400" y="424" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">后台 ROAS 偏爱把熟客算成自己功劳；盯死全盘净毛利与 14 天停投对照，才算真正看懂广告账</text>

  <text x="48" y="458" fill="#52525B" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">RANBRANDOS.COM // 营销增长系列 · 第 4 篇</text>
  <text x="752" y="458" text-anchor="end" fill="#52525B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">SERIES 04/06 // ZH</text>
