  <text x="48" y="98" fill="#F8FAFC" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21.5" font-weight="800">广告后台 ROAS 翻倍，为什么公司账上没多一分钱？</text>
  <text x="48" y="122" fill="#94A3B8" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">拆穿平台抢功劳与扩量暗墙：从 eBay、Uber 停投实证到 2026 美国 710 亿美元零售媒体真相</text>

