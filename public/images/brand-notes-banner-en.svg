  <g transform="translate(44, 210)">
    <rect width="222" height="146" rx="12" fill="#0F172A" stroke="#00F2FE" stroke-opacity="0.45"/>
    <text x="18" y="32" fill="#00F2FE" font-family="monospace" font-size="12" font-weight="bold">M1–M2 // MINDSET &amp; PROOF</text>
    <text x="18" y="64" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">CEPs, JTBD &amp; Spence Signals</text>
    <text x="18" y="92" fill="#94A3B8" font-family="sans-serif" font-size="12.5">Wire recall to live triggers</text>
    <text x="18" y="112" fill="#94A3B8" font-family="sans-serif" font-size="12.5">&amp; unfakeable proof pledges.</text>
    <text x="18" y="134" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">BYRON SHARP · MICHAEL SPENCE</text>
  </g>

  <g transform="translate(289, 210)">
