    <text x="18" y="32" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">M3–M4 // MARGIN &amp; SCALE</text>
    <text x="18" y="64" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">65%+ Pricing &amp; Creator Ads</text>
    <text x="18" y="92" fill="#94A3B8" font-family="sans-serif" font-size="12.5">GBB tiered extraction &amp;</text>
    <text x="18" y="112" fill="#94A3B8" font-family="sans-serif" font-size="12.5">broad DLRM creative probing.</text>
    <text x="18" y="134" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">HERMANN SIMON · META AL-CAT</text>
