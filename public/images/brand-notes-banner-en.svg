      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="60%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <radialGradient id="bnAura" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bnGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(148, 163, 184, 0.06)" stroke-width="1"/>
