  <rect width="800" height="450" fill="url(#bnAura)"/>
  <rect x="16" y="16" width="768" height="418" rx="14" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Watermark -->
  <text x="400" y="235" fill="rgba(255, 255, 255, 0.03)" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle" transform="rotate(-10 400 235)" letter-spacing="4">BRANDOS LAB™ // COGNITIVE BRAND SCIENCE</text>

  <!-- Header Badge -->
  <rect x="44" y="40" width="290" height="28" rx="14" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1"/>
  <circle cx="62" cy="54" r="4" fill="#00F2FE"/>
