    <text x="18" y="32" fill="#A855F7" font-family="monospace" font-size="12" font-weight="bold">M5–M6 // CONVERT &amp; CAUSAL</text>
    <text x="18" y="64" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">100px Mesh &amp; True iROAS</text>
    <text x="18" y="92" fill="#94A3B8" font-family="sans-serif" font-size="12.5">0.85s frictionless checkout &amp;</text>
    <text x="18" y="112" fill="#94A3B8" font-family="sans-serif" font-size="12.5">holdout incrementality rigor.</text>
    <text x="18" y="134" fill="#C084FC" font-family="monospace" font-size="11" font-weight="bold">MECLABS · DONALD RUBIN</text>
